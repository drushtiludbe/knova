
name: Deploy KNOVA

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Inject Firebase Configuration
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MEASUREMENT_ID: ${{ secrets.FIREBASE_MEASUREMENT_ID }}

        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          file = Path("auth.js")
          content = file.read_text()

          replacements = {
              "__FIREBASE_API_KEY__": "FIREBASE_API_KEY",
              "__FIREBASE_AUTH_DOMAIN__": "FIREBASE_AUTH_DOMAIN",
              "__FIREBASE_PROJECT_ID__": "FIREBASE_PROJECT_ID",
              "__FIREBASE_STORAGE_BUCKET__": "FIREBASE_STORAGE_BUCKET",
              "__FIREBASE_MESSAGING_SENDER_ID__": "FIREBASE_MESSAGING_SENDER_ID",
              "__FIREBASE_APP_ID__": "FIREBASE_APP_ID",
              "__FIREBASE_MEASUREMENT_ID__": "FIREBASE_MEASUREMENT_ID"
          }

          for placeholder, variable in replacements.items():
              value = os.environ.get(variable)
              if not value:
                  raise ValueError(f"Missing secret: {variable}")
              content = content.replace(placeholder, value)

          file.write_text(content)
          PY

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
