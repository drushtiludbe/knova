<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KNOVA</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .auth-page {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      border-radius: 14px;
      background: #121116;
      color: white;
      
    }

    .auth-card h1,
    .auth-card .subtitle {
      text-align: center;
    }

    .auth-card h1 {
      margin-bottom: 10px;
    }

    .auth-card .subtitle {
      margin-bottom: 25px;
      color: #ccc;
    }

    .auth-card label {
      display: block;
      margin: 15px 0 7px;
    }

    .auth-card input {
      width: 100%;
      padding: 12px;
      border: 1px solid #555;
      border-radius: 7px;
      background: #080808;
      color: white;
    }

    .auth-submit {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 0;
      border-radius: 7px;
      background : linear-gradient(90deg, #08437a, #3e86f3);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .auth-message {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .auth-switch {
      margin-top: 20px;
      text-align: center;
    }

    .auth-switch a {
      color: #3e8cf3;
    }
  </style>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="auth.js"></script>
</head>

<body>
  <header>
    <a href="index.html" class="logo">KNOVA</a>

    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Log in to continue exploring with KNOVA.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               autocomplete="current-password" required>

        <button class="auth-submit" type="submit">Login</button>
        <p class="auth-message" id="loginMessage" role="status"></p>
      </form>

      <p class="auth-switch">
        New to KNOVA? <a href="signup.html">Create an account</a>
      </p>
    </section>
  </main>

  <footer>
   <p>&copy; 2026 KNOVA.<!--[FYCE] [Div B] [Batch A] [AP] [083 to 087] --> Drushti Ludbe</p>
  </footer>
</body>
</html>
