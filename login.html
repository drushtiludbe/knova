<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - KNOVA</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .auth-page {
      min-height: 75vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: #ffffff;
    }

    .auth-card {
      width: 100%;
      max-width: 430px;
      padding: 35px;
      box-sizing: border-box;
      border-radius: 3px;
      border: 1px solid #dce8ef;
      border-top: 4px solid #0b658f;
      background: #ffffff;
      color: #101820;
    }

    .auth-card h1 {
      margin-bottom: 10px;
      text-align: center;
      color: #101820;
    }

    .auth-card .subtitle {
      margin-bottom: 25px;
      text-align: center;
      color: #586b78;
    }

    .auth-card label {
      display: block;
      margin: 15px 0 7px;
      color: #101820;
    }

    .auth-card input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #cbdbe4;
      border-radius: 3px;
      background: #ffffff;
      color: #101820;
      outline: none;
      font: inherit;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-card input:focus {
      border-color: #5dc6f7;
      box-shadow: 0 0 0 2px rgba(11, 101, 143, 0.10);
    }

    /* Password Show / Hide */
    .password-field {
      position: relative;
      width: 100%;
    }

    .auth-card .password-field input {
      padding-right: 65px;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      padding: 6px;
      border: none;
      background: transparent;
      color: #0b658f;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .password-toggle:hover {
      color: #5dc6f7;
    }

    .auth-submit {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: 1px solid #5dc6f7;
      border-radius: 3px;
      background: #5dc6f7;
      color: #101820;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .auth-submit:hover {
      background: #8bd8fa;
      border-color: #8bd8fa;
    }

    .auth-message {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .auth-switch {
      margin-top: 20px;
      text-align: center;
      color: #586b78;
    }

    .auth-switch a {
      color: #0b658f;
      font-weight: bold;
      text-decoration: none;
    }

    .auth-switch a:hover {
      text-decoration: underline;
    }

    body > footer {
      padding: 20px;
      border-top: 1px solid #e2e8ec;
      background: #ffffff;
      color: #586b78;
      text-align: center;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      .auth-page {
        padding: 30px 16px;
      }

      .auth-card {
        padding: 25px 20px;
      }
    }
  </style>

  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script defer src="auth.js"></script>
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">KNOVA<span>.</span></a>

    <button
      class="hamburger"
      id="hamburger"
      type="button"
      aria-label="Open navigation menu"
      aria-expanded="false"
      aria-controls="main-navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="main-navigation" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <h1>Welcome Back</h1>
      <p class="subtitle">Log in to continue exploring with KNOVA.</p>

      <form id="loginForm">
        <label for="email">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required>

        <label for="password">Password</label>

        <div class="password-field">
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required>

          <button
  type="button"
  class="password-toggle"
  onclick="togglePasswordVisibility()"
  id="passwordToggle">
  Show
</button>
        </div>

        <button class="auth-submit" type="submit">Login</button>

        <p class="auth-message" id="loginMessage" role="status"></p>
      </form>

      <p class="auth-switch">
        New to KNOVA? <a href="signup.html">Create an account</a>
      </p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 KNOVA. Drushti Ludbe</p>
  </footer>

  <script>
    document.querySelectorAll(".password-toggle").forEach(function(button) {
      button.addEventListener("click", function() {
        const input = document.getElementById(button.dataset.target);

        if (!input) return;

        const show = input.type === "password";

        input.type = show ? "text" : "password";
        button.textContent = show ? "Hide" : "Show";
        button.setAttribute("aria-label", show ? "Hide password" : "Show password");
        button.setAttribute("aria-pressed", String(show));
      });
    });
  </script>
<script>
  function togglePasswordVisibility() {
    const password = document.getElementById("password");
    const button = document.getElementById("passwordToggle");

    if (!password || !button) return;

    if (password.type === "password") {
      password.type = "text";
      button.textContent = "Hide";
    } else {
      password.type = "password";
      button.textContent = "Show";
    }
  }
</script>
</body>
</html>
