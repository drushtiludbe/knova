
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Search Results - KNOVA</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="inner-pages.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

  <script src="auth.js" defer></script>
  <script src="script.js" defer></script>
  <script src="results.js" defer></script>
</head>

<body>

  <header class="site-header">
    <a href="index.html" class="logo">KNOVA</a>

    <button
      type="button"
      class="hamburger"
      id="hamburger"
      aria-label="Toggle navigation"
      aria-expanded="false"
      aria-controls="main-navigation">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav id="main-navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section class="page-hero">
    <h1>KNOVA Search</h1>
    <p>Discover resources across domains.</p>
  </section>

  <main class="page-container">

    <form
      class="search-container results-search"
      id="results-search-form"
      action="results.html"
      method="GET">

      <input
        type="search"
        id="search-input"
        name="q"
        placeholder="Search KNOVA resources..."
        aria-label="Search resources"
        required>

      <button class="search-btn" type="submit">
        SEARCH
      </button>
    </form>

    <p
      id="results-message"
      class="result-details"
      aria-live="polite">
      Enter a keyword to discover resources.
    </p>

    <section class="results-section">
      <h2>Search Results</h2>
      <div class="results-list" id="results-list"></div>
    </section>

    <a href="explore.html" class="btn-explore">
      Advanced Explore &rarr;
    </a>

  </main>

  <footer>
    <p>&copy; 2026 KNOVA. Drushti Ludbe</p>
  </footer>

  <div class="login-modal" id="loginModal" hidden>
    <div
      class="login-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="loginModalTitle">

      <button
        type="button"
        class="modal-close"
        id="closeLoginModal"
        aria-label="Close">&times;</button>

      <h2 id="loginModalTitle">Login Required</h2>

      <p>Please log in or create a free KNOVA account before searching.</p>

      <div class="modal-actions">
        <a href="login.html" class="btn">Log In</a>
        <a href="signup.html" class="btn">Sign Up</a>
      </div>
    </div>
  </div>

</body>
</html>
