<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results - KNOVA</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="script.js" defer></script>
<script src="auth.js" defer></script>
</head>
<body>

  <header>
    <a href="index.html" class="logo">KNOVA</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
    <!--<div class="auth-buttons">
      <a href="#" class="btn">Sign In</a>
    </div>-->
  </header>

  <section class="page-hero">
    <h1>KNOVA Search</h1>
    <p>Discover resources across domains.</p>
  </section>

  <main class="page-container">
    <form class="search-container results-search" action="results.html" method="GET">
      <input
        type="search"
        id="search-input"
        name="q"
        placeholder="Search KNOVA resources..."
        aria-label="Search resources"
        required
      >
      <button class="search-btn" type="submit">SEARCH</button>
    </form>

    <p id="results-message" class="result-details" aria-live="polite"></p>

    <section class="results-section">
      <div class="results-list" id="results-list"></div>
    </section>

    <a href="explore.html" class="btn-explore">Advanced Explore &rarr;</a>
  </main>

  <footer>
   <p>&copy; 2026 KNOVA.<!--[FYCE] [Div B] [Batch A] [AP] [083 to 087] --> Drushti Ludbe</p>
  </footer>

<div class="login-modal" id="loginModal" hidden>
  <div class="login-modal-card" role="dialog"
       aria-modal="true" aria-labelledby="loginModalTitle">

    <button type="button" class="modal-close"
            id="closeLoginModal" aria-label="Close">&times;</button>

    <h2 id="loginModalTitle">Login Required</h2>

    <p>Please log in or create a free KNOVA account before searching.</p>

    <div class="modal-actions">
      <a href="login.html" class="btn">Log In</a>
      <a href="signup.html" class="btn">Sign Up</a>
    </div>
  </div>
</div>

</body>
</html>
